# GitHub vypíná plánované workflowy po 60 dnech bez commitu.
# Prázdný commit jednou měsíčně feed udrží v běhu.
name: Keepalive

on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "keepalive"
          git push
